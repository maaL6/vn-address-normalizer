name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # the tests run without a trained model (rule-based fallback), so torch is not needed here
      - run: pip install rapidfuzz fastapi "uvicorn[standard]" httpx pytest
      - run: pytest -q
