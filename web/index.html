<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuẩn hóa địa chỉ 2025</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1d1d1b;--muted:#6b6b66;--line:#e4e3de;--accent:#1f6f5c;
--street:#e8e3ff;--ward:#d9f2e6;--district:#fff1cc;--province:#dceaff;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#20201f;--fg:#ecebe6;--muted:#a3a29c;--line:#34332f;
--accent:#5cc4a6;--street:#3a3360;--ward:#1f4a3a;--district:#4d3f14;--province:#1f3656;--warn:#e0a54a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:32px 16px}
h1{font-size:22px;margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 20px}
.row{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:15px}
button{padding:12px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.ex{margin:10px 0 24px;display:flex;flex-wrap:wrap;gap:6px}.ex span{font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.big{font-size:18px;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.tag{border-radius:4px;padding:1px 4px;margin:0 1px}.STREET{background:var(--street)}.WARD{background:var(--ward)}.DISTRICT{background:var(--district)}.PROVINCE{background:var(--province)}
.legend span{font-size:12px;margin-right:8px}.warn{color:var(--warn)}.muted{color:var(--muted)}
.conf{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.conf div{height:100%;background:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Chuẩn hóa địa chỉ sau sáp nhập 2025</h1>
<p class="sub">Gõ địa chỉ kiểu gì cũng được: không dấu, viết tắt, thiếu dấu phẩy. Hệ thống tách thành phần, tìm đơn vị hành chính và chuyển sang hệ 34 tỉnh, 2 cấp.</p>
<div class="row"><input id="q" placeholder="vd: 12 ng trai p.ben thanh q1 tphcm" autofocus><button id="go">Chuẩn hóa</button></div>
<div class="ex" id="ex"></div>
<div id="out"></div>
</main>
<script>
const EX=["12 ng trai p.ben thanh q1 tphcm","so 1 dai co viet p bach khoa q hai ba trung hn","Số 5 Hùng Vương, P.4, TP Vũng Tàu, BRVT",
"thôn đông, xã tân thông hội, huyện củ chi, sg","45 Lê Duẩn, Phường Sài Gòn, TP.HCM","Ấp 3 X.Long Phước H.Long Thành Đồng Nai"];
const ex=document.getElementById('ex');EX.forEach(t=>{const s=document.createElement('span');s.textContent=t;s.onclick=()=>{q.value=t;run()};ex.appendChild(s)});
const q=document.getElementById('q'),out=document.getElementById('out');
document.getElementById('go').onclick=run;
const pq=new URLSearchParams(location.search).get('q');if(pq){q.value=pq;run()}q.onkeydown=e=>{if(e.key==='Enter')run()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function highlight(text,spans){let h=esc(text);for(const r of ['STREET','WARD','DISTRICT','PROVINCE']){const v=spans[r];if(!v)continue;
 for(const piece of v.split(', ')){const e=esc(piece);const i=h.indexOf(e);if(i>=0)h=h.slice(0,i)+`<span class="tag ${r}">${e}</span>`+h.slice(i+e.length)}}return h}
async function run(){const address=q.value.trim();if(!address)return;out.innerHTML='<p class="muted">Đang xử lý…</p>';
 try{const r=await fetch('/normalize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address})});
 if(!r.ok)throw new Error(r.status);const d=await r.json();render(d)}catch(e){out.innerHTML=`<div class="card warn">Lỗi: ${esc(e.message)}</div>`}}
function render(d){const n=d.new||{},o=d.old;
 let html=`<div class="card"><div class="label">Địa chỉ mới (từ 1/7/2025)</div><div class="big">${esc(n.full_address||n.province||'Không xác định được')}</div>
 <div class="conf"><div style="width:${Math.round((d.confidence||0)*100)}%"></div></div><div class="muted" style="font-size:13px;margin-top:4px">Độ tin cậy ${(d.confidence||0).toFixed(2)} · nhận dạng định dạng: ${d.fmt==='old'?'cũ (3 cấp)':d.fmt==='new'?'mới (2 cấp)':'?'} · ${d.latency_ms??''} ms</div></div>`;
 html+=`<div class="grid"><div class="card"><div class="label">Đơn vị cũ</div>${o?`${esc(o.ward||'—')}<br>${esc(o.district)}<br>${esc(o.province)}`:'<span class="muted">Địa chỉ đã ở định dạng mới</span>'}</div>
 <div class="card"><div class="label">Đơn vị mới</div>${esc(n.ward||'—')}<br>${esc(n.province||'—')}</div></div>`;
 if(d.split_ward){html+=`<div class="card"><div class="label warn">Phường/xã cũ bị chia cho nhiều đơn vị mới</div>Đang chọn đơn vị mặc định theo nghị quyết. Các khả năng:<ul>${d.alternatives.map(a=>`<li>${esc(a.ward)}${a.default?' <b>(mặc định)</b>':''}</li>`).join('')}</ul><span class="muted">Cần số nhà/tên đường cụ thể (geocoding) để chọn chính xác.</span></div>`}
 html+=`<div class="card"><div class="label">Model tách thành phần</div><div>${highlight(d.input,d.spans||{})}</div><div class="legend" style="margin-top:8px"><span class="tag STREET">số nhà/đường</span><span class="tag WARD">phường/xã</span><span class="tag DISTRICT">quận/huyện</span><span class="tag PROVINCE">tỉnh/thành</span></div></div>`;
 out.innerHTML=html}
</script>
</body>
</html>
